name: Public tests

on:
  push:
    branches-ignore: [badges]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.language }} / ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected-results: ${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        language: [C, MIPS]
        task: [task1, task2, task3, task4, task5, task6, task7, bonus1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-java@v4
        if: matrix.language == 'MIPS'
        with:
          distribution: temurin
          java-version: '17'
      - name: Run public test
        env:
          TASK: ${{ matrix.task }}
          LANGUAGE: ${{ matrix.language }}
          LIT_TEST_TIMEOUT: '20'
        run: make -C "src/$TASK/$LANGUAGE" test

  aggregate:
    name: Count passed tests and update badge
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      EXPECTED_RESULTS: ${{ needs.test.outputs.expected-results }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Count passed tests
        id: totals
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, filter: 'latest',
            });
            const tests = jobs.filter(job => /^(C|MIPS) \/ (task[1-7]|bonus1)$/.test(job.name));
            const expected = Number(process.env.EXPECTED_RESULTS);
            if (!Number.isSafeInteger(expected) || expected <= 0 || tests.length !== expected ||
                new Set(tests.map(job => job.name)).size !== tests.length) {
              throw new Error('Missing or duplicate test jobs');
            }
            const counts = {C: [0, 0], MIPS: [0, 0]};
            for (const job of tests) {
              const result = job.steps.find(step => step.name === 'Run public test');
              if (!result || !['success', 'failure'].includes(result.conclusion)) {
                throw new Error(`Test did not finish: ${job.name}`);
              }
              const count = counts[job.name.split(' / ')[0]];
              count[0] += Number(result.conclusion === 'success');
              count[1]++;
            }
            const passed = counts.C[0] + counts.MIPS[0];
            const total = tests.length;
            core.setOutput('status', `${passed}/${total} passed`);
            core.setOutput('color', passed === total ? '4c1' : passed === 0 ? 'e05d44' : 'dfb317');
            await core.summary.addHeading(`Tests passed: ${passed}/${total}`)
              .addTable([
                [{data: 'Language', header: true}, {data: 'Passed', header: true}],
                ...Object.entries(counts).map(([language, [pass, all]]) => [language, `${pass}/${all}`]),
              ]).write();
      - uses: actions/checkout@v4
        if: env.PUBLISH == 'true'
        with:
          persist-credentials: false
      - run: mkdir -p badge
        if: env.PUBLISH == 'true'
      - uses: emibcn/badge-action@v2.0.4
        if: env.PUBLISH == 'true'
        with:
          label: Tests
          status: ${{ steps.totals.outputs.status }}
          color: ${{ steps.totals.outputs.color }}
          path: badge/tests.svg
      - uses: JamesIves/github-pages-deploy-action@v4
        if: env.PUBLISH == 'true'
        with:
          branch: badges
          folder: badge
          target-folder: .github/badges
          clean: false
          force: false
